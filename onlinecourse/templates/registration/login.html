{% extends "onlinecourse/base.html" %}

{% block title %}Sign in | OnlineCourse{% endblock %}

{% block content %}
  <h1>Sign in</h1>
  {% if form.errors %}
    <div class="alert alert-danger" role="alert">Your username or password was not accepted.</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
{% endblock %}
